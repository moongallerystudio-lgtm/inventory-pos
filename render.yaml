services:
  - type: web
    name: moon-gallery-pos-web
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: moon-gallery-pos-db
          property: connectionString

databases:
  - name: moon-gallery-pos-db
    plan: free
    databaseName: moon_gallery_pos
    user: moon_gallery_pos
    postgresMajorVersion: "15"
